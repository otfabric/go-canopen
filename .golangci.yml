version: "2"

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet checks (shadow, printf, etc.)
    - ineffassign    # assigned but never used
    - staticcheck    # comprehensive static analysis (includes gosimple + unused)
    - misspell       # common spelling mistakes
    - godot          # comment punctuation
    - nilerr         # return nil instead of err
    - exhaustive     # exhaustive switch on enums
  exclusions:
    rules:
      # Tests close buses, ports and connections in deferred and cleanup
      # calls whose errors do not matter; production code is checked.
      - path: _test\.go
        linters: [errcheck]
      - path: examples/
        linters: [errcheck]
  settings:
    exhaustive:
      default-signifies-exhaustive: true  # a default: case satisfies exhaustiveness
    misspell:
      ignore-rules:
        # CiA 306 spells the EDS section [DeviceComissioning] this way;
        # eds.DeviceComissioning and ExportOptions.Comissioning follow it.
        - comissioning

formatters:
  enable:
    - gofmt          # formatting
    - goimports      # import grouping / formatting

  exclusions:
    paths:
      - examples

issues:
  # Bump the default per-linter issue limit (default is 50)
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  # Include //go:build interop packages (the planned interop suite) so
  # that they are linted by make lint-ci / make check, not only compiled
  # by make interop.
  build-tags:
    - interop