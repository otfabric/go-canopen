name: Self-interop
run-name: "Self-interop against canopen-interop-otfabric:latest, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. This commit against the latest published image of go-canopen itself
# (ghcr.io/otfabric/canopen-interop-otfabric:latest, from otfabric/canopen-interop),
# in every role of the interop suite, on a vcan interface. The e2e tests run both
# sides from one commit; this one finds a change on the wire that breaks an
# earlier release.
#
# Not part of the Interop workflow, which runs against the independent references,
# and never a required check. Nothing is pinned or committed, so it cannot ask for
# a release. A pass is not independent verification (INTEROPERABILITY.md).
on:
  workflow_dispatch:
  push: # TEMPORARY: run once from the PR branch; removed before merging
    branches: [ci/self-interop]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/otfabric/canopen-interop-otfabric:latest

jobs:
  self-interop:
    name: This commit against canopen-interop-otfabric:latest
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CANopen runs on SocketCAN: the runner's kernel gets the CAN modules
      # and vcan0, as in interop.yml.
      - name: Load the CAN modules and create vcan0
        run: |
          scripts/ci-can-modules.sh
          sudo ip link add vcan0 type vcan
          sudo ip link set vcan0 mtu 72 up

      - name: Pull the image
        run: docker pull "${IMAGE}"

      - name: Versions
        id: versions
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-canopen under test | \`${REF}\` at \`${SHA}\` (\`$(git describe --tags --always)\`) |"
            echo "| Go | \`$(go env GOVERSION)\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Image digest | \`${digest}\` |"
            docker run --rm "${IMAGE}" print-version | jq -r '"| Image reports | `\(.stack)`, adapter `\(.adapterVersion)` |"'
            docker run --rm "${IMAGE}" print-capabilities | jq -r '"| go-canopen in the image | `\(.upstream.version)` at `\(.upstream.revision)` |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        env:
          CANOPEN_INTEROP_OTFABRIC_IMAGE: ${{ steps.versions.outputs.digest }}
          CANOPEN_INTEROP_ADAPTERS: otfabric
          CANOPEN_REQUIRE_VCAN: "1"
          CANOPEN_REQUIRE_INTEROP: "1"
        run: |
          set -o pipefail
          GOWORK=off go test -v -tags interop -count=1 -timeout 60m ./interop/ 2>&1 | tee interop.log
          {
            echo "## Result"
            echo
            echo "- $(grep -c -- '--- PASS' interop.log) passed, $(grep -c -- '--- SKIP' interop.log) skipped, $(grep -c -- '--- FAIL' interop.log) failed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
