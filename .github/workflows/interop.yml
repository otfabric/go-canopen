name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-canopen against the independent CANopen stacks of
# otfabric/canopen-interop on a vcan interface: CANopenNode, Lely CANopen
# and python canopen, as devices for the go-canopen master, as masters and
# clients of a go-canopen node, and as EDS checkers. The images are pulled
# by the release and digest in interop/harness_test.go; nothing of
# canopen-interop is built here. A capability an image lacks is a recorded
# skip, never a pass; differences are reported only as the documented
# known differences (INTEROPERABILITY.md).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Interop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Load the CAN modules and create vcan0
        run: |
          scripts/ci-can-modules.sh
          sudo ip link add vcan0 type vcan
          sudo ip link set vcan0 mtu 72 up
          ip -d link show vcan0
      - name: Interop suite
        run: make interop
      - name: Summary
        if: always()
        run: |
          [ -f bin/interop-report.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("bin/interop-report.json"))
          print("## go-canopen interop results (canopen-interop " + d["interopRelease"] + ")\n")
          print("| Adapter / direction | pass | known-difference | skip | fail |\n|---|---|---|---|---|")
          for k, c in sorted(d["counts"].items()):
              print(f"| {k} | {c['Pass']} | {c['Known']} | {c['Skip']} | {c['Fail']} |")
          print("\n| Adapter | Direction | Scenario | Result | Detail |\n|---|---|---|---|---|")
          for r in d["results"]:
              if r["result"] != "pass":
                  print(f"| {r['adapter']} | {r['direction']} | {r['scenario']} | {r['result']} | {r.get('detail', '').replace('|', '/')} |")
          PY
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-report-${{ matrix.arch }}
          path: bin/interop-report.json
          if-no-files-found: warn
